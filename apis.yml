aid: xoom
name: Xoom
description: Xoom is PayPal's international money transfer (remittance) service,
  operating since 2001. Consumers use Xoom to send money to bank accounts, debit
  cards, mobile wallets, UPI, and PIX, send cash for pickup or delivery, and reload
  mobile phones in countries around the world, with up-front fees and exchange
  rates. U.S. transfers are provided by PayPal, Inc., a licensed money transmitter;
  UK/EEA service is provided by PayPal (Europe) S.a r.l., regulated by the
  Luxembourg CSSF. Xoom is a consumer service and publishes no public developer API
  on the xoom.com domain.
